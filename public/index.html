<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Planifica tu viaje en moto: ruta, clima, talleres mecánicos, miradores y fotos del destino en una sola búsqueda." />
  <meta name="theme-color" content="#e8590c" />
  <title>MotoRuta Web · Planifica tu viaje en moto</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <h1>🏍️ MotoRuta Web</h1>
    <p>Ruta, clima, talleres y fotos del destino en una sola búsqueda.</p>
  </header>

  <main>
    <form id="search" class="card search" autocomplete="off">
      <label>
        <span>Origen</span>
        <span class="input-group">
          <input id="from" name="from" type="text" placeholder="Ej. Cusco" required minlength="2" maxlength="120" />
          <button type="button" id="locate" class="ghost" title="Usar mi ubicación" aria-label="Usar mi ubicación">📍</button>
        </span>
      </label>
      <button type="button" id="swap" class="ghost" title="Intercambiar origen y destino" aria-label="Intercambiar origen y destino">⇄</button>
      <label>
        <span>Destino</span>
        <input id="to" name="to" type="text" placeholder="Ej. Ollantaytambo" required minlength="2" maxlength="120" />
      </label>
      <button type="submit" id="go" class="primary">Buscar ruta</button>
    </form>

    <div class="examples">
      Prueba con:
      <button type="button" class="chip" data-from="Cusco" data-to="Ollantaytambo">Cusco → Ollantaytambo</button>
      <button type="button" class="chip" data-from="Lima" data-to="Paracas">Lima → Paracas</button>
      <button type="button" class="chip" data-from="Arequipa" data-to="Cabanaconde">Arequipa → Cabanaconde</button>
    </div>
    <div class="examples" id="favorites" hidden></div>
    <div class="examples" id="recent" hidden></div>

    <div id="status" role="status" aria-live="polite" hidden></div>
    <noscript><p class="card">Esta aplicación necesita JavaScript activado.</p></noscript>

    <section id="results" hidden>
      <div id="notices"></div>
      <div class="grid">
        <div class="card map-card"><div id="map" aria-label="Mapa de la ruta"></div></div>
        <aside class="side">
          <div class="card" id="summary"></div>
          <div class="card" id="weather"></div>
        </aside>
      </div>

      <div class="card" id="elevation"></div>
      <div class="card" id="places"></div>
      <div class="card" id="photos"></div>
    </section>
  </main>

  <footer>
    Datos de <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>,
    Nominatim, OSRM, Overpass, <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> y
    <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a>. Verifica siempre el estado de la vía antes de viajar.
  </footer>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
