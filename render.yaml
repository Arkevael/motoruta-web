# Blueprint de Render: New → Blueprint → selecciona el repositorio.
services:
  - type: web
    name: motoruta-web
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PEXELS_API_KEY
        sync: false          # se pide al crear el servicio
      - key: NOMINATIM_USER_AGENT
        sync: false          # ej: MotoRutaWeb/1.0 (proyecto academico; tu-correo@ejemplo.com)
      - key: DATABASE_URL
        sync: false          # cadena de conexión de Neon o Supabase (opcional)
      - key: ADMIN_PASSWORD
        sync: false          # clave del panel /admin.html (mín. 8 caracteres)
